# ============================================
# CajaViva Sync API - Render.com Blueprint
# Despliegue automatizado en Render (compatible con Railway/Fly.io)
# ============================================

services:
  # API Backend Service
  - type: web
    name: cajaviva-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon  # Cambia según tu preferencia: oregon, frankfurt, singapore
    plan: free      # Opciones: free, starter, standard, pro
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: CajaViva Sync API
      - key: DEBUG
        value: "false"
      - key: API_V1_STR
        value: /api/v1
      - key: ENVIRONMENT
        value: production
      # DATABASE_URL se configura automáticamente al linkear la BD
      - key: SECRET_KEY
        generateValue: true  # Genera clave secreta aleatoria
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: BACKEND_CORS_ORIGINS
        value: "https://cajaviva-frontend.onrender.com,https://tu-dominio.com"
      - key: MAX_BATCH_SIZE
        value: "100"
      - key: SYNC_TIMEOUT_SECONDS
        value: "30"
      # Pool settings para Neon serverless
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "1800"

  # PostgreSQL Database (Neon-compatible en Render)
  - type: pserv
    name: cajaviva-db
    region: oregon
    plan: free
    ipAllowList: []  # Permitir conexiones desde cualquier IP (para Neon external)

# Nota: Para usar Neon directamente, comenta el servicio pserv arriba
# y configura DATABASE_URL manualmente en envVars:
# - key: DATABASE_URL
#   value: postgresql+asyncpg://user:pass@ep-xxx.region.neon.tech/dbname?sslmode=require