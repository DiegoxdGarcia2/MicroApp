# ============================================
# CajaViva Sync API — Render Blueprint
# Base de datos: Neon PostgreSQL (externa)
# Este archivo es opcional: el despliegue principal se hace via
# .ai/mcp/cloud_deployer_mcp.py (Render API).
# ============================================

services:
  - type: web
    name: cajaviva-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Se configura en el dashboard de Render (nunca en el repo)
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: SECRET_KEY
        generateValue: true
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "1800"
